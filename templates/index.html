<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Text Summarizer</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 40px;
      text-align: center;
      background-color: #f0f4f8;
    }

    .container {
      max-width: 650px;
      margin: auto;
      background: #ffffff;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    h2 {
      color: #1e6485;
      margin-bottom: 25px;
    }

    textarea {
      width: 100%;
      height: 160px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      resize: vertical;
      transition: border-color 0.3s ease;
    }

    textarea:focus {
      border-color: #1e6485;
      outline: none;
    }

    select {
      margin-top: 15px;
      padding: 10px;
      width: 100%;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      transition: border-color 0.3s ease;
    }

    select:focus {
      border-color: #1e6485;
      outline: none;
    }

    button {
      margin-top: 25px;
      padding: 14px 30px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background-color: #1e6485;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.2s;
    }

    button:hover {
      background-color: #15516b;
      transform: translateY(-2px);
    }

    .spinner-container {
      display: none;
      margin-top: 30px;
    }

    .spinner {
      border: 6px solid #f3f3f3;
      border-top: 6px solid #1e6485;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      animation: spin 1s linear infinite;
      margin: auto;
    }

    .spinner-text {
      margin-top: 12px;
      font-weight: 500;
      color: #333;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .result-box {
      margin-top: 35px;
      text-align: left;
      background-color: #f9f9f9;
      padding: 20px;
      border-radius: 10px;
      border-left: 6px solid #1e6485;
    }

    .result-box h3 {
      margin-top: 0;
      color: #1e6485;
    }

    .result-box p {
      font-size: 16px;
      line-height: 1.6;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Résumé de texte</h2>
    <form id="summaryForm" method="post" action="/">
      <textarea name="text" placeholder="Insérer le texte ici…" required></textarea>
      <br>
      <select name="language" required>
        <option value="en">English</option>
        <option value="fr">French</option>
      </select>
      <br>
      <button type="submit" id="submitButton">Générer un résumé</button>
    </form>

    <div class="spinner-container" id="spinnerContainer">
      <div class="spinner"></div>
      <div class="spinner-text">Résumé en cours…</div>
    </div>

    {% if summary %}
      <div class="result-box">
        <h3>Summary:</h3>
        <p>{{ summary }}</p>
      </div>
    {% endif %}
  </div>

  <script>
    const form = document.getElementById("summaryForm");
    const submitBtn = document.getElementById("submitButton");
    const spinner = document.getElementById("spinnerContainer");

    form.addEventListener("submit", function () {
      submitBtn.style.display = "none";
      spinner.style.display = "block";
    });
  </script>
</body>
</html>
